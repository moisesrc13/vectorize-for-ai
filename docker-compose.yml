version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:latest
    env_file:
      - .env.shared
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    command: python app.py
    env_file:
      - .env.shared
    environment:
      - OPENSEARCH_HOST=opensearch
      - API_HOST=0.0.0.0
    ports:
      - "8010:8010"
    depends_on:
      - opensearch
    restart: unless-stopped

  mcp:
    build: .
    command: python mcp_app.py
    env_file:
      - .env.shared
    environment:
      - API_HOST=api
      - MCP_HOST=0.0.0.0
    ports:
      - "8443:8443"
    depends_on:
      - api
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:dev
    ports:
      - "3000:8080"
    volumes:
      - open-webui-dev:/app/backend/data
    env_file:
      - .env.shared
    depends_on:
      - mcp
    restart: unless-stopped

volumes:
  opensearch-data:
    external: true
  open-webui-dev:
    external: true
