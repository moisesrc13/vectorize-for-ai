[project]
name = "vectorize-for-ai"
version = "0.1.0"
description = ""
authors = [
    {name = "Moises Romo",email = "jm.roco@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.3,<0.53.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sentence-transformers (>=5.7.0,<6.0.0)",
    "llama-index (>=0.14.23,<0.15.0)",
    "docling (>=2.120.1,<3.0.0)",
    "llama-index-readers-docling (>=0.4.2,<0.5.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "llama-index-embeddings-huggingface (>=0.7.0,<0.8.0)",
    "opensearch-py (>=3.2.0,<4.0.0)",
    "llama-index-vector-stores-opensearch (>=1.2.0,<2.0.0)",
    "llama-index-node-parser-docling (>=0.4.2,<0.5.0)",
    "llama-index-core (>=0.14.23,<0.15.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "google-auth (>=2.56.3,<3.0.0)",
    "google-auth-oauthlib (>=1.4.0,<2.0.0)",
    "google-auth-httplib2 (>=0.4.1,<0.5.0)",
    "google-api-python-client (>=2.198.0,<3.0.0)",
    "pymilvus[model] (>=3.0.1,<4.0.0)",
    "fakeredis (>=2.37.0,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "ghostscript (>=0.8.1,<0.9.0)",
    "gigatoken (>=0.10.0,<0.11.0)"
]

[tool.poetry]
packages = [{include = "vectorize_for_ai", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
